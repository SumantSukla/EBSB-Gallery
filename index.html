<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" as="image" href="assets/mandala.webp">
  <link rel="preload" as="image" href="assets/mandala2.webp">
  <link rel="preload" as="image" href="assets/bg.webp">
  <title>EBSB Event Gallery</title>
  <style>

    @font-face {
        font-family: 'Reality Stone';
        src: url('assets/reality-stone.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #541c62;
      min-height: 100vh;
      overflow: visible;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      background-color: #541c62;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 1.5s ease-in, visibility 1.5s ease-in;
    }

    .spinner1 {
        width: 200px;
        height: 200px;
        /* Smooth CSS rotation */
        animation: spin 3s linear infinite;
        position: absolute;
    }

    .spinner2 {
        width: 380px;
        height: 380px;
        /* Smooth CSS rotation */
        animation: spin 3s linear infinite reverse;
        position: absolute;
    }

    .bg-loader {
        width: 120vw;
        opacity: 0.05;
        animation: spin 200s linear infinite;
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* Class added via JS to hide loader */
    #loader-wrapper.loader-hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Main Content Entrance Animation */
    .content {
      opacity: 0;
      transition: opacity 1s ease-in,;
      width: 100vw;
      margin: 0 auto;
      text-align: center;
    }

    body.loaded .content {
      opacity: 1;
    }

    .image {
      position: absolute;
      width: 20vw;
    }

    .title-card {
      position: absolute;
      top: 100vh;
      left: 0;
      text-align: center;
      z-index: 1;
      height: 100vh;
      width: 100vw;
      background-color: #541c62b0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-card .title {
      font-family: 'Reality Stone', sans-serif;
      font-size: 6rem;
      text-align: center;
      color: #FDB515;
      text-shadow: 
        1px 1px 0px #d35400,
        2px 2px 0px #d35400,
        3px 3px 0px #d35400,
        4px 4px 0px #d35400,
        5px 5px 0px #d35400,
        10px 15px 20px rgba(0, 0, 0, 0.81),
        10px 15px 20px rgba(0, 0, 0, 0.81),
        10px 15px 20px rgba(0, 0, 0, 0.81);
    }

    .cream-card {
      position: absolute;
      top: 200vh;
      left: 0;
      text-align: center;
      z-index: 1;
      height: 100vh;
      width: 100vw;
      background-color: #ffeddc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img-card {
        left: 35vw;
        width: 30vw;
        border-radius: 20px;
        position: absolute;
        transition: 0.5s ease-in-out;
    }

    .img-card.left {
        width: 22vw;
        left: 11vw;
    }

    .img-card.right {
        width: 22vw;
        left: 67vw;
    }

    .img-card.hidden-left {
        width: 0.1vw;
        left: -0.1vw;
    }

    .img-card.hidden-right {
        width: 0.1vw;
        left: 100vw;
    }

    .arrow {
        border: solid #541c62;
        border-width: 0 8px 8px 0;
        display: inline-block;
        padding: 17px;
        background-color: #ffeddc;
        transition: 0.1s ease-in-out;
    }

    .aright {
        transform: rotate(-45deg);
        -webkit-transform: rotate(-45deg);
        left: 93.5vw;
        position: absolute;
    }

    .aleft {
        transform: rotate(135deg);
        -webkit-transform: rotate(135deg);
        left: 4.5vw;
        position: absolute;
    }

    .arrow:hover {
        padding: 20px;
        border-width: 0 10px 10px 0;
    }

  </style>
</head>
<body>

  <!--  Preloader -->
  <div id="loader-wrapper">
    <img src="assets/mandala.webp" alt="Loading..." class="spinner1">
    <img src="assets/mandala2.webp" class="spinner2">
    <img src="assets/bg.webp" class="bg-loader">
  </div>

  <!-- Page Content -->
  <main class="content">

    <!-- Scrolling Gallery -->
    <div id = "scrolling-gallery" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden;">
        <div id = "column1" style="position: absolute; left:0; top:0; width: 20vw; height: 100vh; overflow: hidden;">   
            <image id="image1_1" src="assets/image1_1.webp" class="image" style="left: 0; top: 0vw"></image>
            <image id="image1_2" src="assets/image1_2.webp" class="image" style="left: 0; top: 25vw;"></image>
            <image id="image1_3" src="assets/image1_3.webp" class="image" style="left: 0; top: 50vw;"></image>
            <image id="image1_4" src="assets/image1_4.webp" class="image" style="left: 0; top: 75vw;"></image>
            <image id="image1_5" src="assets/image1_5.webp" class="image" style="left: 0; top: 100vw;"></image>
            <image id="image1_6" src="assets/image1_6.heic" class="image" style="left: 0; top: 125vw;"></image>
        </div>
        <div id = "column2" style="position: absolute; left:20vw; top:0; width: 20vw; height: 100vh; overflow: hidden;">   
            <image id="image2_1" src="assets/image2_1.webp" class="image" style="left: 0; bottom: 0vw"></image>
            <image id="image2_2" src="assets/image2_2.webp" class="image" style="left: 0; bottom: 25vw;"></image>
            <image id="image2_3" src="assets/image2_3.heic" class="image" style="left: 0; bottom: 50vw;"></image>
            <image id="image2_4" src="assets/image2_4.jpg" class="image" style="left: 0; bottom: 75vw;"></image>
            <image id="image2_5" src="assets/image2_5.jpg" class="image" style="left: 0; bottom: 100vw;"></image>
            <image id="image2_6" src="assets/image2_6.heic" class="image" style="left: 0; bottom: 125vw;"></image>
        </div>
        <div id = "column3" style="position: absolute; left:40vw; top:0; width: 20vw; height: 100vh; overflow: hidden;">   
            <image id="image3_1" src="assets/image3_1.webp" class="image" style="left: 0; top: 0vw"></image>
            <image id="image3_2" src="assets/image3_2.jpg" class="image" style="left: 0; top: 25vw;"></image>
            <image id="image3_3" src="assets/image3_3.jpg" class="image" style="left: 0; top: 50vw;"></image>
            <image id="image3_4" src="assets/image3_4.jpg" class="image" style="left: 0; top: 75vw;"></image>
            <image id="image3_5" src="assets/image3_5.webp" class="image" style="left: 0; top: 100vw;"></image>
            <image id="image3_6" src="assets/image3_6.webp" class="image" style="left: 0; top: 125vw;"></image>
        </div>
        <div id = "column4" style="position: absolute; left:60vw; top:0; width: 20vw; height: 100vh; overflow: hidden;">   
            <image id="image4_1" src="assets/image4_1.webp" class="image" style="left: 0; bottom: 0vw"></image>
            <image id="image4_2" src="assets/image4_2.jpg" class="image" style="left: 0; bottom: 25vw;"></image>
            <image id="image4_3" src="assets/image4_3.jpg" class="image" style="left: 0; bottom: 50vw;"></image>
            <image id="image4_4" src="assets/image4_4.webp" class="image" style="left: 0; bottom: 75vw;"></image>
            <image id="image4_5" src="assets/image4_5.webp" class="image" style="left: 0; bottom: 100vw;"></image>
            <image id="image4_6" src="assets/image4_6.jpg" class="image" style="left: 0; bottom: 125vw;"></image>
        </div>
        <div id = "column5" style="position: absolute; left:80vw; top:0; width: 20vw; height: 100vh; overflow: hidden;">   
            <image id="image5_1" src="assets/image5_1.jpg" class="image" style="left: 0; top: 0vw"></image>
            <image id="image5_2" src="assets/image5_2.webp" class="image" style="left: 0; top: 25vw;"></image>
            <image id="image5_3" src="assets/image5_3.jpg" class="image" style="left: 0; top: 50vw;"></image>
            <image id="image5_4" src="assets/image5_4.webp" class="image" style="left: 0; top: 75vw;"></image>
            <image id="image5_5" src="assets/image5_5.jpg" class="image" style="left: 0; top: 100vw;"></image>
            <image id="image5_6" src="assets/image5_6.webp" class="image" style="left: 0; top: 125vw;"></image>
        </div>
    </div>

    <!-- Title Card Overlay -->
    <div id="title-card" class="title-card">
        <div class="title">Ek Bharat Shreshtha Bharat</div>
    </div>
    
    <!-- Horizontal Gallery -->
    <div class="cream-card">
        <image id="imageH1" src="assets/imageH1.webp" class = "img-card"></image>
        <image id="imageH5" src="assets/imageH5.jpg" class = "img-card left"></image>
        <image id="imageH2" src="assets/imageH2.heic" class = "img-card right"></image>
        <image id="imageH3" src="assets/imageH3.jpg" class = "img-card hidden-right"></image>
        <image id="imageH4" src="assets/imageH4.jpg" class = "img-card hidden-left"></image>
        <image src="assets/bg.webp" class="bg-loader" style = "opacity:0.2; z-index: -1;"></image>

        <button class="arrow aleft" onclick="scroll_left()"></button>
        <button class="arrow aright" onclick="scroll_right()"></button>
    </div>

  </main>

  <script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const loader = document.getElementById('loader-wrapper');
            loader.classList.add('loader-hidden');
            document.body.classList.add('loaded');
            window.scrollTo(0, 0);
        }, 2000)
    });

    images = [[],[],[],[],[]]
    h_images = []

    for (let i = 0; i < 5; i++) 
    {
        for (let j = 0; j < 6; j++) 
        {
            images[i][j] = document.getElementById(`image${i+1}_${j+1}`);
        }
    }

    for (let i = 0; i < 5; i++) 
    {
        h_images[i] = document.getElementById(`imageH${i+1}`);
    }



    const speed = 0.1;

    setInterval(() => {
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 6; j++) {
                if (i % 2 == 0)
                {
                    const image = images[i][j];
                    const currentTop = parseFloat(image.style.top);
                    const newTop = currentTop - speed;
                    image.style.top = `${newTop}vw`;

                    // Reset position when the image moves out of view
                    if (newTop < -25) {
                        image.style.top = '125vw';
                    }
                }
                else
                {
                    const image = images[i][j];
                    const currentBottom = parseFloat(image.style.bottom);
                    const newBottom = currentBottom - speed;
                    image.style.bottom = `${newBottom}vw`;

                    // Reset position when the image moves out of view
                    if (newBottom < -25) {
                        image.style.bottom = '125vw';
                    }
                }
            }
        }
    }, 16); // Approximately 60 frames per second


    // The title card should move upwards when scrolled, covering the gallery.
    const title_card = document.getElementById('title-card');
    const cream_card = document.querySelector('.cream-card');

    window.addEventListener('scroll', () => {
        const scrollPosition = window.scrollY; 
        const moveAmount = scrollPosition * 0.5; // Multiplied by factor to control speed
        title_card.style.transform = `translateY(${moveAmount}px)`;
        cream_card.style.transform = `translateY(${moveAmount}px)`;
    });



    function scroll_left() {
        for (let i = 0; i < 5; i++) {

            if (h_images[i].classList.contains('left')) 
            {
                h_images[i].classList.remove('left');
                h_images[i].classList.add('hidden-left');
            } 
            else if (h_images[i].classList.contains('right')) 
            {
                h_images[i].classList.remove('right');
            } 
            else if (h_images[i].classList.contains('hidden-right')) 
            {
                h_images[i].classList.remove('hidden-right');
                h_images[i].classList.add('right');
            } 
            else if (h_images[i].classList.contains('hidden-left')) 
            {
                h_images[i].classList.remove('hidden-left');
                h_images[i].classList.add('hidden-right');
            }
            else 
            {
                h_images[i].classList.add('left');
            }

        }
    }

    function scroll_right() {
        for (let i = 0; i < 5; i++) {

            if (h_images[i].classList.contains('left')) 
            {
                h_images[i].classList.remove('left');
            } 
            else if (h_images[i].classList.contains('right')) 
            {
                h_images[i].classList.remove('right');
                h_images[i].classList.add('hidden-right');
            } 
            else if (h_images[i].classList.contains('hidden-right')) 
            {
                h_images[i].classList.remove('hidden-right');
                h_images[i].classList.add('hidden-left');
            } 
            else if (h_images[i].classList.contains('hidden-left')) 
            {
                h_images[i].classList.remove('hidden-left');
                h_images[i].classList.add('left');
            }
            else 
            {
                h_images[i].classList.add('right');
            }

        }
    }

  </script>
</body>
</html>
